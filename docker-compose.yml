services:
  pc-ecosystem:
    image: ghcr.io/roberhood314/pc-ecosystem:latest
    container_name: PC-Ecosystem
    labels:
      pi.ui.primary: "true"
    ports:
      - "127.0.0.1:18763:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      NODE_KEY: ${NODE_KEY:?NODE_KEY is required}
      TUNNEL: ${TUNNEL:-1}
      LOCAL_AI: ${LOCAL_AI:-0}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
